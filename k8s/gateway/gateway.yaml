apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: roomops-gateway
  namespace: roomops
spec:
  gatewayClassName: eg
  listeners:
    - name: https
      hostname: roomops.local
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: roomops-tls
            kind: Secret
      allowedRoutes:
        namespaces:
          from: Same
