apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: roomops-route
  namespace: roomops
spec:
  parentRefs:
    - name: roomops-gateway
      sectionName: https
  hostnames:
    - roomops.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: roomops-api
          port: 8000
