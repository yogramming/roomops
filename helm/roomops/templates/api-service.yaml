{{- if .Values.api.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: roomops-api
  labels:
    {{- include "roomops.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: roomops-api
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
