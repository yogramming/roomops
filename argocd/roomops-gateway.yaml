apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: roomops-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default

  source:
    repoURL: https://github.com/yogramming/roomops.git
    targetRevision: main
    path: k8s/gateway

  destination:
    server: https://kubernetes.default.svc
    namespace: roomops

  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=false
