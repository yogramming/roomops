services:
  postgres:
    image: postgres:17-alpine
    container_name: roomops-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-roomops}
      POSTGRES_USER: ${POSTGRES_USER:-roomops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: roomops-api
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-roomops}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-roomops}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_ENV: production
      FLASK_DEBUG: "0"

    ports:
      - "127.0.0.1:5000:8000"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
